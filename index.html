<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealmScape – Free Browser RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0a06;
    color: #c8a870;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background particles */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.4;
  }

  .landing-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 24px;
    max-width: 440px;
    width: 100%;
  }

  /* Logo */
  .logo-area {
    text-align: center;
  }
  .logo-icon {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(200,168,112,0.6));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(200,168,112,0.4)); }
    50% { filter: drop-shadow(0 0 24px rgba(200,168,112,0.8)); }
  }
  .logo-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 38px;
    color: #e8c880;
    text-shadow: 0 0 20px rgba(200,168,112,0.5), 2px 2px 0 #3d2b1a;
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .logo-sub {
    font-size: 11px;
    color: #8a7255;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Stats banner */
  .stats-banner {
    display: flex;
    gap: 24px;
    font-size: 11px;
    color: #7a6040;
    letter-spacing: 1px;
  }
  .stats-banner span { color: #c8a870; }

  /* Auth box */
  .auth-box {
    width: 100%;
    background: linear-gradient(180deg, #1e1508 0%, #150f06 100%);
    border: 2px solid #5c4a2a;
    border-radius: 4px;
    box-shadow: 0 0 0 1px #2a1f0f, 0 8px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(200,168,112,0.1);
    overflow: hidden;
  }

  /* Tabs */
  .auth-tabs {
    display: flex;
    border-bottom: 2px solid #5c4a2a;
  }
  .auth-tab {
    flex: 1;
    padding: 14px;
    background: #0d0a06;
    color: #7a6040;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 1px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
  }
  .auth-tab:hover { color: #c8a870; background: #150f06; }
  .auth-tab.active {
    background: #1e1508;
    color: #e8c880;
    border-bottom-color: #c8a870;
  }

  /* Form */
  .auth-form { padding: 28px; display: none; flex-direction: column; gap: 18px; }
  .auth-form.active { display: flex; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label {
    font-size: 11px;
    color: #8a7255;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
  }
  .form-input {
    background: #0d0a06;
    border: 1px solid #5c4a2a;
    border-radius: 2px;
    color: #e8c880;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus {
    border-color: #c8a870;
    box-shadow: 0 0 0 1px rgba(200,168,112,0.3);
  }
  .form-input::placeholder { color: #3a2f1a; }

  .form-btn {
    background: linear-gradient(180deg, #6b4e1a 0%, #4a3210 100%);
    border: 1px solid #c8a870;
    border-radius: 2px;
    color: #e8c880;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .form-btn:hover {
    background: linear-gradient(180deg, #8b6e2a 0%, #6a4820 100%);
    box-shadow: 0 0 12px rgba(200,168,112,0.3);
  }
  .form-btn:active { transform: translateY(1px); }
  .form-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-error {
    background: #2a0a0a;
    border: 1px solid #8b2222;
    border-radius: 2px;
    color: #ff6666;
    font-size: 12px;
    padding: 8px 10px;
    display: none;
  }
  .form-error.show { display: block; }

  .form-success {
    background: #0a2a0a;
    border: 1px solid #226622;
    border-radius: 2px;
    color: #66cc66;
    font-size: 12px;
    padding: 8px 10px;
    display: none;
  }
  .form-success.show { display: block; }

  /* Features */
  .features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .feature {
    background: rgba(30,21,8,0.6);
    border: 1px solid #3a2a10;
    border-radius: 2px;
    padding: 10px 12px;
    font-size: 11px;
    color: #7a6040;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feature-icon { font-size: 16px; }

  /* Footer */
  .footer {
    font-size: 10px;
    color: #4a3820;
    letter-spacing: 1px;
  }

  /* Loading overlay */
  #loading-overlay {
    position: fixed; inset: 0;
    background: #0d0a06;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    transition: opacity 0.5s;
  }
  #loading-overlay.fade { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: 'Cinzel Decorative', serif;
    font-size: 28px;
    color: #c8a870;
  }
  .loading-bar-wrap {
    width: 200px;
    height: 6px;
    background: #1e1508;
    border: 1px solid #5c4a2a;
    border-radius: 3px;
    overflow: hidden;
  }
  .loading-bar {
    height: 100%;
    background: linear-gradient(90deg, #6b4e1a, #c8a870);
    animation: loadbar 1.2s ease-in-out forwards;
  }
  @keyframes loadbar { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="loading-overlay">
  <div class="loading-logo">⚔ RealmScape ⚔</div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <div style="font-size:11px;color:#5a4030;letter-spacing:2px;">LOADING...</div>
</div>

<div class="landing-wrap">
  <div class="logo-area">
    <div class="logo-icon">⚔️</div>
    <div class="logo-title">RealmScape</div>
    <div class="logo-sub">Free Browser RPG</div>
  </div>

  <div class="stats-banner">
    <div>⚔️ Combat</div>
    <div>🪓 Woodcutting</div>
    <div>⛏️ Mining</div>
    <div>🎣 Fishing</div>
  </div>

  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">New Account</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form active" id="form-login" onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" id="login-user" placeholder="Your username" autocomplete="username" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="login-pass" placeholder="Your password" autocomplete="current-password">
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="form-btn" type="submit" id="login-btn">▶ Play Now</button>
    </form>

    <!-- Register Form -->
    <form class="auth-form" id="form-register" onsubmit="doRegister(event)">
      <div class="form-group">
        <label class="form-label">Choose Username</label>
        <input class="form-input" type="text" id="reg-user" placeholder="3–20 characters, letters/numbers" autocomplete="username" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">Choose Password</label>
        <input class="form-input" type="password" id="reg-pass" placeholder="At least 4 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password">
      </div>
      <div class="form-error" id="reg-error"></div>
      <div class="form-success" id="reg-success"></div>
      <button class="form-btn" type="submit" id="reg-btn">⚔ Create Character</button>
    </form>
  </div>

  <div class="features">
    <div class="feature"><span class="feature-icon">🗺️</span>Open World</div>
    <div class="feature"><span class="feature-icon">📊</span>9 Skills</div>
    <div class="feature"><span class="feature-icon">💾</span>Auto-Save</div>
    <div class="feature"><span class="feature-icon">🎒</span>28 Inventory</div>
  </div>

  <div class="footer">© REALMSCAPE 2025 — ALL RIGHTS RESERVED</div>
</div>

<script>
// Background particle canvas
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];
function initBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  stars = Array.from({length: 80}, () => ({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    r: Math.random() * 1.5 + 0.3,
    speed: Math.random() * 0.3 + 0.05,
    opacity: Math.random() * 0.5 + 0.1
  }));
}
function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  // Draw grid
  bgCtx.strokeStyle = 'rgba(92,74,42,0.08)';
  bgCtx.lineWidth = 1;
  for (let x = 0; x < bgCanvas.width; x += 48) {
    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height); bgCtx.stroke();
  }
  for (let y = 0; y < bgCanvas.height; y += 48) {
    bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(bgCanvas.width, y); bgCtx.stroke();
  }
  // Draw stars
  stars.forEach(s => {
    s.y -= s.speed;
    if (s.y < 0) { s.y = bgCanvas.height; s.x = Math.random() * bgCanvas.width; }
    bgCtx.fillStyle = `rgba(200,168,112,${s.opacity})`;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fill();
  });
  requestAnimationFrame(animateBg);
}
initBg();
animateBg();
window.addEventListener('resize', initBg);

// Remove loading overlay
window.addEventListener('load', () => {
  setTimeout(() => {
    const ol = document.getElementById('loading-overlay');
    ol.classList.add('fade');
    setTimeout(() => ol.remove(), 500);
  }, 1200);
});

// Check if already logged in
(function() {
  const token = localStorage.getItem('rs_token');
  if (token) {
    // Verify token is not expired by trying to decode it
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp * 1000 > Date.now()) {
        window.location.href = '/game.html';
      } else {
        localStorage.removeItem('rs_token');
        localStorage.removeItem('rs_username');
      }
    } catch(e) {
      localStorage.removeItem('rs_token');
    }
  }
})();

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').classList.toggle('active', tab === 'login');
  document.getElementById('form-register').classList.toggle('active', tab === 'register');
}

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.classList.remove('show');

  if (!username || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Login failed'; errEl.classList.add('show'); }
    else {
      localStorage.setItem('rs_token', data.token);
      localStorage.setItem('rs_username', data.username);
      btn.textContent = '✓ Welcome back, ' + data.username + '!';
      setTimeout(() => { window.location.href = '/game.html'; }, 600);
    }
  } catch (err) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.add('show');
  } finally {
    if (btn.textContent !== '✓ Welcome back, ' + document.getElementById('login-user').value.trim() + '!')
      btn.disabled = false, btn.textContent = '▶ Play Now';
  }
}

async function doRegister(e) {
  e.preventDefault();
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const errEl = document.getElementById('reg-error');
  const sucEl = document.getElementById('reg-success');
  const btn = document.getElementById('reg-btn');
  errEl.classList.remove('show'); sucEl.classList.remove('show');

  if (!username || !password) { errEl.textContent = 'Please fill in all fields.'; errEl.classList.add('show'); return; }
  if (password !== pass2) { errEl.textContent = 'Passwords do not match.'; errEl.classList.add('show'); return; }
  if (password.length < 4) { errEl.textContent = 'Password must be at least 4 characters.'; errEl.classList.add('show'); return; }
  if (username.length < 3) { errEl.textContent = 'Username must be at least 3 characters.'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Creating character...';
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Registration failed'; errEl.classList.add('show'); }
    else {
      localStorage.setItem('rs_token', data.token);
      localStorage.setItem('rs_username', data.username);
      sucEl.textContent = '✓ Character created! Entering the realm...';
      sucEl.classList.add('show');
      setTimeout(() => { window.location.href = '/game.html'; }, 1000);
    }
  } catch (err) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '⚔ Create Character';
  }
}

// Allow Enter key on username field to focus password
document.getElementById('login-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-pass').focus();
});
document.getElementById('reg-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('reg-pass').focus();
});
document.getElementById('reg-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('reg-pass2').focus();
});
</script>
</body>
</html>
