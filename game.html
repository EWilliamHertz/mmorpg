<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealmScape</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1208; color: #c8b97a; font-family: monospace; overflow: hidden; }
    #gameWrapper { display: flex; height: 100vh; width: 100vw; }
    #gameCanvas { display: block; cursor: crosshair; flex: 1; width: 100%; height: 100%; }

    /* Right Panel */
    #sidePanel {
      width: 140px; min-width: 140px; background: #2a1f0e;
      border-left: 2px solid #8B6914; display: flex; flex-direction: column;
      overflow: hidden;
    }
    #playerBar {
      background: #1a1208; padding: 6px 8px; border-bottom: 1px solid #8B6914;
      display: flex; align-items: center; justify-content: space-between; font-size: 11px;
    }
    #playerName { color: #ffe066; font-weight: bold; }
    #hpBarWrap { flex: 1; margin: 0 8px; }
    #hpBar { height: 10px; background: #00cc44; border-radius: 3px; transition: width 0.3s; }
    #hpBarBg { background: #333; border-radius: 3px; }
    #hpVal { font-size: 10px; color: #aaa; }
    #logoutBtn { background: #3a1a00; border: 1px solid #8B6914; color: #c8a200; padding: 2px 6px; cursor: pointer; font-size: 10px; border-radius: 2px; }

    /* Tabs */
    #tabs { display: flex; background: #1a1208; border-bottom: 1px solid #8B6914; }
    .tab-btn { flex: 1; padding: 5px 2px; background: none; border: none; color: #8B6914; cursor: pointer; font-size: 10px; font-family: monospace; }
    .tab-btn.active { background: #2a1f0e; color: #ffe066; border-bottom: 2px solid #ffe066; }
    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 4px; }

    /* Inventory */
    #inventoryGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .inv-slot {
      width: 38px; height: 38px; background: #1a1208; border: 1px solid #4a3000;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      position: relative; font-size: 16px; border-radius: 2px;
    }
    .inv-slot:hover { border-color: #ffe066; background: #2a2000; }
    .inv-slot .qty { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #ffe066; }
    #coinsRow { margin-top: 4px; font-size: 11px; color: #ffe066; padding: 2px 4px; }

    /* Skills */
    #skillsGrid { display: grid; grid-template-columns: 1fr; gap: 2px; }
    .skill-item { background: #1a1208; border: 1px solid #4a3000; padding: 2px; display: flex; align-items: center; gap: 2px; font-size: 9px; }
    .skill-name { flex: 1; color: #c8b97a; }
    .skill-level { color: #ffe066; font-weight: bold; }

    /* Equipment */
    #eqGrid { display: grid; grid-template-areas: ". head ." "neck body ring" "weapon legs offhand" ". feet hands"; gap: 2px; padding: 2px; }
    .eq-slot { width: 40px; height: 40px; background: #1a1208; border: 1px solid #4a3000; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; border-radius: 2px; }
    .eq-slot:hover { border-color: #ffe066; }
    #eq-head { grid-area: head; } #eq-neck { grid-area: neck; } #eq-body { grid-area: body; }
    #eq-ring { grid-area: ring; } #eq-weapon { grid-area: weapon; } #eq-legs { grid-area: legs; }
    #eq-offhand { grid-area: offhand; } #eq-feet { grid-area: feet; } #eq-hands { grid-area: hands; }

    /* Chat */
    #chatBox { height: 120px; overflow-y: auto; font-size: 10px; padding: 4px; background: #111; }
    .chat-msg { padding: 1px 0; border-bottom: 1px solid #1a1208; }
    .chat-system { color: #88ccff; }
    .chat-player { color: #ffe066; }
    #chatInputRow { display: flex; gap: 2px; padding: 4px; }
    #chatInput { flex: 1; background: #1a1208; border: 1px solid #4a3000; color: #c8b97a; font-size: 10px; padding: 3px; font-family: monospace; }
    #chatSend { background: #3a2800; border: 1px solid #8B6914; color: #c8a200; padding: 3px 7px; cursor: pointer; font-size: 10px; }

    /* Minimap */
    #minimapWrap { padding: 4px; background: #1a1208; border-top: 1px solid #4a3000; }
    #minimap { display: block; width: 100%; border: 1px solid #4a3000; }

    /* Notification */
    #notification { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1a1208; border: 2px solid #8B6914; color: #ffe066; padding: 8px 20px; font-size: 12px; font-family: monospace; display: none; z-index: 100; border-radius: 4px; }
    #notification.visible { display: block; }
    #notification.levelup { border-color: #ffe066; background: #3a2800; }
    #notification.error { border-color: #cc0000; color: #ff6666; }
    #notification.success { border-color: #00cc44; color: #88ff88; }

    /* Modal */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200; }
    .modal-box { background: #2a1f0e; border: 2px solid #8B6914; padding: 24px; min-width: 260px; text-align: center; }
    .modal-box h3 { color: #ffe066; margin-bottom: 12px; }
    .modal-box p { margin-bottom: 8px; font-size: 12px; }
    .modal-btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .modal-btns button { background: #3a2800; border: 1px solid #8B6914; color: #c8a200; padding: 6px 18px; cursor: pointer; font-family: monospace; font-size: 12px; }
    .modal-btns button:hover { background: #5a3a00; }

    /* Trade Window */
    #tradeWindow {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #2a1f0e; border: 2px solid #8B6914; width: 420px; z-index: 150; display: none;
      font-size: 11px;
    }
    .trade-header { background: #1a1208; padding: 8px; text-align: center; color: #ffe066; font-size: 13px; border-bottom: 1px solid #4a3000; }
    .trade-body { display: flex; }
    .trade-side { flex: 1; padding: 8px; border-right: 1px solid #4a3000; }
    .trade-side:last-child { border-right: none; }
    .trade-label { color: #c8a200; margin-bottom: 4px; }
    .trade-items { min-height: 80px; background: #1a1208; border: 1px solid #4a3000; padding: 4px; }
    .trade-item { padding: 2px 0; }
    .trade-coins { margin-top: 4px; color: #ffe066; }
    .trade-confirmed.yes { color: #00cc44; }
    .trade-actions { display: flex; gap: 6px; padding: 8px; background: #1a1208; }
    .trade-actions button { flex: 1; background: #3a2800; border: 1px solid #8B6914; color: #c8a200; padding: 5px; cursor: pointer; font-family: monospace; font-size: 11px; }
    .trade-actions button:hover { background: #5a3a00; }
    .trade-actions .btn-danger { border-color: #8B0000; color: #ff6666; }

    /* Duel Window */
    #duelWindow {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #2a1f0e; border: 2px solid #cc0000; width: 280px; z-index: 150; display: none;
      padding: 12px; font-size: 12px; text-align: center;
    }
    .duel-header { color: #ff6666; font-size: 14px; font-weight: bold; margin-bottom: 12px; }
    .duel-hp { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .hp-track { background: #333; height: 8px; border-radius: 4px; margin-top: 3px; }
    .hp-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .duel-note { font-size: 10px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="sidePanel">
    <div id="playerBar">
      <span id="playerName"></span>
      <div id="hpBarWrap">
        <div id="hpBarBg">
          <div id="hpBar" style="width:100%"></div>
        </div>
        <span id="hpVal">10/10</span>
      </div>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <div id="tabs">
      <button class="tab-btn active" data-tab="inventory" onclick="switchTab('inventory')">🎒</button>
      <button class="tab-btn" data-tab="skills" onclick="switchTab('skills')">📊</button>
      <button class="tab-btn" data-tab="equipment" onclick="switchTab('equipment')">⚔️</button>
      <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">💬</button>
    </div>

    <div id="tab-inventory" class="tab-content" style="display:block">
      <div id="inventoryGrid"></div>
      <div id="coinsRow">💰 Coins: <span id="coinsVal">0</span></div>
    </div>

    <div id="tab-skills" class="tab-content">
      <div id="skillsGrid"></div>
    </div>

    <div id="tab-equipment" class="tab-content">
      <div id="eqGrid">
        <div></div><div id="eq-head" class="eq-slot" title="Head"></div><div></div>
        <div id="eq-neck" class="eq-slot" title="Neck"></div>
        <div id="eq-body" class="eq-slot" title="Body"></div>
        <div id="eq-ring" class="eq-slot" title="Ring"></div>
        <div id="eq-weapon" class="eq-slot" title="Weapon"></div>
        <div id="eq-legs" class="eq-slot" title="Legs"></div>
        <div id="eq-offhand" class="eq-slot" title="Off-hand"></div>
        <div></div><div id="eq-feet" class="eq-slot" title="Feet"></div>
        <div id="eq-hands" class="eq-slot" title="Hands"></div>
      </div>
    </div>

    <div id="tab-chat" class="tab-content" style="flex-direction:column; display:none; padding:0">
      <div id="chatBox"></div>
      <div id="chatInputRow">
        <input id="chatInput" type="text" placeholder="Say something..." maxlength="100">
        <button id="chatSend">Send</button>
      </div>
    </div>

    <div id="minimapWrap">
      <canvas id="minimap" width="120" height="120"></canvas>
    </div>
  </div>
</div>

<!-- Overlays -->
<div id="notification"></div>
<div id="modal"></div>
<div id="tradeWindow"></div>
<div id="duelWindow"></div>

<script>
  // Set player name
  const storedUser = localStorage.getItem('rs_username');
  document.getElementById('playerName').textContent = storedUser || 'Player';
</script>
<script src="game.js"></script>
</body>
</html>
